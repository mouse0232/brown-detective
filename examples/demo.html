<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>测试指纹采集</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    .result { background: #f0f0f0; padding: 20px; border-radius: 8px; margin-top: 20px; }
    .success { color: #28a745; }
    .error { color: #dc3545; }
    .log { background: #2d2d2d; color: #f0f0f0; padding: 10px; border-radius: 4px; margin: 10px 0; font-family: monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>🧪 指纹采集测试</h1>
  <div id="status">正在加载...</div>
  <div id="result" class="result" style="display:none;"></div>
  <div id="logs" class="log" style="display:none;"></div>

  <script src="/docs/creep-lite.js"></script>
  <script>
    const statusEl = document.getElementById('status')
    const resultEl = document.getElementById('result')
    const logsEl = document.getElementById('logs')
    const logs = []
    
    function log(msg, type = 'info') {
      const time = new Date().toLocaleTimeString()
      logs.push(`[${time}] ${type}: ${msg}`)
      logsEl.innerHTML = logs.join('<br>')
      logsEl.style.display = 'block'
      console.log('[Demo]', msg)
    }

    if (!window.CreepLite) {
      statusEl.innerHTML = '<span class="error">❌ CreepLite 未加载</span>'
      log('CreepLite 未加载', 'error')
    } else {
      log('开始采集指纹...')
      
      window.CreepLite({
        apiEndpoint: '/api/fingerprint',
        cacheEnabled: false,
        sendToAPI: true,
      }).then(fp => {
        log(`采集完成，FP ID: ${fp.fingerprintId?.substring(0, 16)}...`)
        log(`采集时间：${fp.collectionTime.toFixed(2)} ms`)
        
        statusEl.innerHTML = '<span class="success">✅ 采集成功</span>'
        resultEl.style.display = 'block'
        resultEl.innerHTML = `
          <p><strong>FP ID:</strong> ${fp.fingerprintId?.substring(0, 64)}...</p>
          <p><strong>采集时间:</strong> ${fp.collectionTime.toFixed(2)} ms</p>
          <p><strong>详细 ID:</strong> ${fp.stableHash?.substring(0, 32)}...</p>
        `
        
        // 手动测试 API
        log('测试 API 连接...')
        testAPI(fp).catch(err => log(`API 测试失败：${err.message}`, 'error'))
        
        console.log('完整指纹:', fp)
      }).catch(err => {
        statusEl.innerHTML = '<span class="error">❌ 采集失败: ' + err.message + '</span>'
        log(`采集失败：${err.message}`, 'error')
        console.error('采集错误:', err)
      })
    }
    
    async function testAPI(fp) {
      try {
        log('正在发送指纹到 API...')
        const startTime = Date.now()
        
        const response = await fetch('/api/fingerprint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fingerprint: fp })
        })
        
        const elapsed = Date.now() - startTime
        log(`API 响应时间：${elapsed} ms, 状态：${response.status}`)
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`)
        }
        
        const result = await response.json()
        log(`API 返回：decision=${result.analysis?.decision}, risk=${result.analysis?.riskScore}`)
        
        resultEl.innerHTML += `
          <hr style="margin: 15px 0; border: none; border-top: 1px solid #ccc;">
          <p><strong>✅ API 响应成功!</strong></p>
          <p><strong>决策:</strong> ${result.analysis?.decision || 'N/A'}</p>
          <p><strong>风险分:</strong> ${result.analysis?.riskScore || 0}</p>
          <p><strong>等级:</strong> ${result.analysis?.level || 'N/A'}</p>
          <p><strong>风险因素:</strong> ${result.analysis?.risks?.length || 0}</p>
        `
      } catch (err) {
        log(`API 调用失败：${err.message}`, 'error')
        resultEl.innerHTML += `
          <hr style="margin: 15px 0; border: none; border-top: 1px solid #ccc;">
          <p class="error"><strong>❌ API 调用失败:</strong> ${err.message}</p>
        `
      }
    }
  </script>
</body>
</html>
