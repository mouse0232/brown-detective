<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站防护示例 - CreepJS 集成演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .card h1 { color: #667eea; margin-bottom: 20px; }
        .card p { color: #666; line-height: 1.6; margin-bottom: 30px; }
        .status {
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            font-weight: 600;
        }
        .status.loading { background: #bee3f8; color: #2c5282; }
        .status.success { background: #c6f6d5; color: #276749; }
        .status.warning { background: #feebc8; color: #c05621; }
        .status.danger { background: #fed7d7; color: #742a2a; }
        .spinner {
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .info-box {
            background: #f0f4ff;
            border: 2px solid #667eea;
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
        }
        .info-box code {
            background: #e2e8f0;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 13px;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        .btn:hover { background: #5568d3; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <!-- 正常内容页面 -->
    <div id="normal-content" class="card">
        <h1>🎉 访问已授权</h1>
        <p>你的浏览器指纹已通过验证，风险等级：<strong id="riskLevel">-</strong></p>
        
        <div class="info-box">
            <div><strong>🆔 指纹 ID:</strong></div>
            <div style="font-family: monospace; font-size: 12px; word-break: break-all; margin-top: 5px;" id="fpId">-</div>
        </div>

        <div class="info-box">
            <div><strong>📊 分析结果:</strong></div>
            <div style="font-size: 13px; margin-top: 5px;" id="analysisDetails">-</div>
        </div>

        <p style="font-size: 14px; color: #999; margin-top: 30px;">
            这是一个示例页面，演示如何集成 CreepJS 进行访客风险评估
        </p>
    </div>

    <!-- 拦截页面（默认隐藏） -->
    <div id="blocked-content" class="card hidden">
        <h1 style="color: #e53e3e;">🚫 访问被拒绝</h1>
        <p>检测到高风险访问行为，已被系统拦截</p>
        
        <div class="status danger">
            风险评分：<span id="blockScore">-</span>/100
        </div>

        <div class="info-box">
            <div><strong>🆔 指纹 ID:</strong></div>
            <div style="font-family: monospace; font-size: 12px; word-break: break-all; margin-top: 5px;" id="blockFpId">-</div>
        </div>

        <p style="font-size: 14px; color: #999; margin-top: 20px;">
            如果你认为这是误判，请联系管理员
        </p>
    </div>

    <!-- 验证页面（默认隐藏） -->
    <div id="challenge-content" class="card hidden">
        <h1 style="color: #dd6b20;">⚠️ 需要验证</h1>
        <p>检测到异常访问特征，需要完成验证</p>
        
        <div class="status warning">
            风险评分：<span id="challengeScore">-</span>/100
        </div>

        <div class="info-box">
            <div><strong>🤔 为什么需要验证？</strong></div>
            <div style="font-size: 13px; margin-top: 5px;">
                系统检测到一些不寻常的浏览器特征，为了确保你不是自动化程序，请完成验证
            </div>
        </div>

        <button class="btn" onclick="alert('这是一个示例，实际项目中这里会显示验证码组件')">
            🔐 完成验证
        </button>
    </div>

    <!-- 加载状态 -->
    <div id="loading-content" class="card">
        <div class="spinner"></div>
        <h2>正在进行安全验证...</h2>
        <p>正在分析你的浏览器指纹，请稍候</p>
        <div class="status loading">
            正在连接指纹采集服务...
        </div>
    </div>

    <!-- 引入 creep-lite.js 并集成 -->
    <script src="/docs/creep-lite.js"></script>
    <script>
        // 页面加载完成后自动执行
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                // 调用 CreepLite 进行指纹采集和分析
                const fp = await window.CreepLite({
                    apiEndpoint: '/api/fingerprint',  // 发送到本地 API 服务
                    cacheEnabled: true,
                    cacheTTL: 1800000  // 30 分钟缓存
                });

                console.log('指纹采集完成:', fp);

                // 根据风险决策显示不同页面
                const decision = fp.analysis?.decision;
                const riskScore = fp.analysis?.riskScore;
                const level = fp.analysis?.level;

                // 隐藏所有状态
                document.getElementById('loading-content').classList.add('hidden');
                document.getElementById('normal-content').classList.add('hidden');
                document.getElementById('blocked-content').classList.add('hidden');
                document.getElementById('challenge-content').classList.add('hidden');

                // 根据决策显示对应页面
                if (decision === 'BLOCK') {
                    // 高风险 - 直接拦截
                    document.getElementById('blocked-content').classList.remove('hidden');
                    document.getElementById('blockScore').textContent = riskScore;
                    document.getElementById('blockFpId').textContent = fp.fingerprintId;
                    document.title = '访问被拒绝 - CreepJS';
                } else if (decision === 'CHALLENGE') {
                    // 中风险 - 需要验证
                    document.getElementById('challenge-content').classList.remove('hidden');
                    document.getElementById('challengeScore').textContent = riskScore;
                    document.title = '需要验证 - CreepJS';
                } else {
                    // 低风险 - 正常放行
                    document.getElementById('normal-content').classList.remove('hidden');
                    document.getElementById('riskLevel').textContent = level || 'unknown';
                    document.getElementById('fpId').textContent = fp.fingerprintId;
                    
                    // 显示详细分析
                    const risks = fp.analysis?.risks || [];
                    if (risks.length > 0) {
                        document.getElementById('analysisDetails').innerHTML = `
                            检测到 ${risks.length} 个风险因素:<br>
                            ${risks.map(r => `<span style="background: #feebc8; padding: 2px 6px; border-radius: 4px; font-size: 12px; margin: 2px; display: inline-block;">${r.type}</span>`).join('')}
                        `;
                    } else {
                        document.getElementById('analysisDetails').textContent = '✅ 未检测到风险因素';
                    }
                    document.title = '✅ 访问已授权 - CreepJS';
                }

            } catch (error) {
                console.error('指纹采集失败:', error);
                
                // 采集失败时显示错误页面
                document.getElementById('loading-content').classList.add('hidden');
                document.getElementById('normal-content').classList.add('hidden');
                document.getElementById('blocked-content').classList.add('hidden');
                document.getElementById('challenge-content').classList.add('hidden');
                
                alert('指纹采集失败，请稍后刷新页面重试\n\n错误信息：' + error.message);
                
                // 或者可以选择直接放行（根据业务需求）
                // document.getElementById('normal-content').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
