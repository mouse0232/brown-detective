<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 测试</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 6px; }
    .success { background: #d4edda; border-color: #28a745; }
    .error { background: #f8d7da; border-color: #dc3545; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 4px; overflow-x: auto; }
    h2 { color: #333; }
  </style>
</head>
<body>
  <h1>🧪 CreepJS API 测试</h1>
  
  <div class="test">
    <h3>测试 1: 健康检查</h3>
    <div id="test1"></div>
  </div>

  <div class="test">
    <h3>测试 2: 模拟指纹分析</h3>
    <div id="test2"></div>
  </div>

  <div class="test">
    <h3>测试 3: 统计数据</h3>
    <div id="test3"></div>
  </div>

  <script>
    async function test1() {
      try {
        const res = await fetch('/api/health')
        const data = await res.json()
        document.getElementById('test1').innerHTML = `
          <div class="success">✓ 健康检查通过</div>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `
      } catch (e) {
        document.getElementById('test1').innerHTML = `
          <div class="error">✗ 失败：${e.message}</div>
        `
      }
    }

    async function test2() {
      try {
        const mockFingerprint = {
          navigator: {
            userAgent: 'Mozilla/5.0',
            platform: 'Win32',
            language: 'zh-CN',
            $hash: 'test123'
          },
          screen: {
            width: 1920,
            height: 1080,
            colorDepth: 24,
            $hash: 'test456'
          },
          canvas2d: {
            dataURI: 'data:image/png;base64,xxx',
            $hash: 'test789'
          },
          canvasWebgl: {
            renderer: 'NVIDIA GeForce',
            $hash: 'testabc'
          },
          timezone: {
            zone: 'Asia/Shanghai',
            location: 'CN',
            $hash: 'testdef'
          },
          fonts: {
            fonts: ['Arial', 'Times New Roman'],
            $hash: 'testghi'
          }
        }

        const res = await fetch('/api/fingerprint', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fingerprint: mockFingerprint })
        })
        const data = await res.json()
        
        const riskClass = data.analysis.riskScore < 30 ? 'success' : 
                         data.analysis.riskScore < 50 ? 'warning' : 'error'
        
        document.getElementById('test2').innerHTML = `
          <div class="${riskClass}">
            ✓ 分析成功<br>
            风险评分：<strong>${data.analysis.riskScore}</strong><br>
            决策：<strong>${data.analysis.decision}</strong>
          </div>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `
      } catch (e) {
        document.getElementById('test2').innerHTML = `
          <div class="error">✗ 失败：${e.message}</div>
        `
      }
    }

    async function test3() {
      try {
        const res = await fetch('/api/stats')
        const data = await res.json()
        document.getElementById('test3').innerHTML = `
          <div class="success">✓ 统计数据获取成功</div>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `
      } catch (e) {
        document.getElementById('test3').innerHTML = `
          <div class="error">✗ 失败：${e.message}</div>
        `
      }
    }

    // 运行测试
    test1()
    test2()
    test3()
  </script>
</body>
</html>
