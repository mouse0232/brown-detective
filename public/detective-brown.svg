<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- 布朗探长 - Q 版侦探形象 -->
  
  <!-- 身体 -->
  <ellipse cx="100" cy="140" rx="50" ry="40" fill="#1a1a1a" stroke="#00ffff" stroke-width="2"/>
  
  <!-- 风衣 -->
  <path d="M 50 140 L 60 190 L 140 190 L 150 140" fill="none" stroke="#00ffff" stroke-width="2"/>
  <line x1="100" y1="140" x2="100" y2="180" stroke="#00ffff" stroke-width="2"/>
  <circle cx="100" cy="155" r="3" fill="#ffd700"/>
  <circle cx="100" cy="170" r="3" fill="#ffd700"/>
  
  <!-- 头部 -->
  <circle cx="100" cy="90" r="45" fill="#ffd700" stroke="#00ffff" stroke-width="2"/>
  
  <!-- 猎鹿帽 -->
  <path d="M 55 70 L 145 70 L 145 65 L 155 65 L 155 60 L 45 60 L 45 65 L 55 65 Z" fill="#1a1a1a" stroke="#00ffff" stroke-width="2"/>
  <ellipse cx="100" cy="65" rx="50" ry="8" fill="#1a1a1a" stroke="#00ffff" stroke-width="2"/>
  <path d="M 50 65 Q 100 40 150 65" fill="none" stroke="#00ffff" stroke-width="2"/>
  
  <!-- 眼睛 -->
  <circle cx="85" cy="90" r="8" fill="#ffffff" stroke="#00ffff" stroke-width="1.5"/>
  <circle cx="115" cy="90" r="8" fill="#ffffff" stroke="#00ffff" stroke-width="1.5"/>
  <circle cx="87" cy="90" r="4" fill="#1a1a1a"/>
  <circle cx="117" cy="90" r="4" fill="#1a1a1a"/>
  <circle cx="88" cy="89" r="1.5" fill="#ffffff"/>
  <circle cx="118" cy="89" r="1.5" fill="#ffffff"/>
  
  <!-- 单片放大镜（右眼） -->
  <circle cx="115" cy="90" r="12" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.8"/>
  <line x1="125" y1="95" x2="135" y2="105" stroke="#ffd700" stroke-width="2" opacity="0.8"/>
  
  <!-- 眉毛 -->
  <path d="M 75 80 Q 85 75 95 80" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 105 80 Q 115 75 125 80" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- 嘴巴 -->
  <path d="M 90 110 Q 100 115 110 110" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 放大镜道具 -->
  <ellipse cx="150" cy="130" rx="25" ry="25" fill="none" stroke="#00ffff" stroke-width="3"/>
  <line x1="165" y1="145" x2="180" y2="160" stroke="#ffd700" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 霓虹光晕效果 -->
  <circle cx="100" cy="90" r="50" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.3" filter="blur(2px)"/>
</svg>
