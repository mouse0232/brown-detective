<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>布朗探长 SDK 示例 - 浏览器集成</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }
    
    .status-card {
      background: #f8f9ff;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
      border-left: 4px solid #667eea;
    }
    
    .status-label {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }
    
    .status-value {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }
    
    .risk-low { color: #38a169; }
    .risk-medium { color: #d69e2e; }
    .risk-high { color: #e53e3e; }
    .risk-critical { color: #9b2c2c; }
    
    .btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    
    .result-box {
      background: #1a1a1a;
      color: #e0e0e0;
      border-radius: 8px;
      padding: 20px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      overflow-x: auto;
      margin-top: 20px;
      display: none;
    }
    
    .result-box pre {
      margin: 0;
      white-space: pre-wrap;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }
    
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 10px;
    }
    
    .badge-success {
      background: #c6f6d5;
      color: #276749;
    }
    
    .badge-warning {
      background: #feebc8;
      color: #c05621;
    }
    
    .badge-danger {
      background: #fed7d7;
      color: #742a2a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🕵️ 布朗探长 SDK 示例</h1>
    <p class="subtitle">集成反指纹浏览器检测到你的网站</p>
    
    <div class="status-card">
      <div class="status-label">检测状态</div>
      <div class="status-value" id="statusText">
        准备检测
      </div>
    </div>
    
    <div class="status-card">
      <div class="status-label">风险评分</div>
      <div class="status-value" id="riskScore">
        -
      </div>
    </div>
    
    <div class="status-card">
      <div class="status-label">风险等级</div>
      <div class="status-value" id="riskLevel">
        -
      </div>
    </div>
    
    <div class="status-card">
      <div class="status-label">建议操作</div>
      <div class="status-value" id="recommendation">
        -
      </div>
    </div>
    
    <button class="btn" id="checkBtn" onclick="checkBrowser()">
      🔍 开始检测浏览器
    </button>
    
    <div class="loading" id="loading" style="display: none;">
      <div class="spinner"></div>
      <div>正在采集指纹数据，请稍候...</div>
    </div>
    
    <div class="result-box" id="resultBox">
      <pre id="resultJson"></pre>
    </div>
  </div>
  
  <script>
    // 模拟 SDK 初始化
    const BrownDetective = {
      apiUrl: '/api/v1/detect',
      apiKey: 'demo_key',
      
      init: function(options) {
        this.apiUrl = options.apiUrl;
        this.apiKey = options.apiKey;
        console.log('BrownDetective initialized');
      },
      
      // 采集指纹
      collectFingerprint: async function() {
        return new Promise((resolve) => {
          const fingerprint = {
            fingerprint: 'fp_' + Math.random().toString(36).substring(2, 18),
            browserData: {
              navigator: {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                hardwareConcurrency: navigator.hardwareConcurrency || 4,
                deviceMemory: navigator.deviceMemory || 8,
                webdriver: navigator.webdriver || false
              },
              screen: {
                width: screen.width,
                height: screen.height,
                colorDepth: screen.colorDepth
              },
              timezone: {
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                offset: -new Date().getTimezoneOffset() / 60
              }
            },
            timestamp: Date.now()
          };
          resolve(fingerprint);
        });
      },
      
      // 发送到后端
      sendToBackend: async function(fingerprint) {
        try {
          const response = await fetch(this.apiUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + this.apiKey
            },
            body: JSON.stringify(fingerprint)
          });
          
          if (!response.ok) {
            throw new Error('请求失败：' + response.status);
          }
          
          return await response.json();
        } catch (error) {
          console.error('发送失败:', error);
          // Demo 模式：返回模拟数据
          return this.generateMockReport(fingerprint);
        }
      },
      
      // 生成模拟报告（Demo 用）
      generateMockReport: function(fingerprint) {
        const riskScore = Math.floor(Math.random() * 100);
        let riskLevel = 'low';
        if (riskScore > 75) riskLevel = 'critical';
        else if (riskScore > 50) riskLevel = 'high';
        else if (riskScore > 25) riskLevel = 'medium';
        
        return {
          success: true,
          data: {
            riskScore: riskScore,
            riskLevel: riskLevel,
            isBot: riskScore > 70,
            detectedBrowsers: riskScore > 70 ? ['AdsPower'] : [],
            automationDetected: fingerprint.browserData.navigator.webdriver,
            proxyDetected: false,
            deviceId: fingerprint.fingerprint,
            details: {
              browser: { score: 10, level: 'low' },
              hardware: { score: 25, level: 'low' },
              system: { score: 20, level: 'low' },
              behavior: { score: 0, level: 'low' },
              automation: { score: fingerprint.browserData.navigator.webdriver ? 40 : 0, level: 'low' },
              network: { score: 0, level: 'low' }
            },
            recommendation: riskScore > 70 ? 'block' : riskScore > 40 ? 'captcha' : 'allow',
            timestamp: Date.now()
          },
          requestId: 'req_' + Math.random().toString(36).substring(2, 12)
        };
      },
      
      // 主检测流程
      check: async function() {
        const fingerprint = await this.collectFingerprint();
        return await this.sendToBackend(fingerprint);
      }
    };
    
    // 初始化
    BrownDetective.init({
      apiUrl: '/api/v1/detect',
      apiKey: 'demo_key'
    });
    
    // 检测函数
    async function checkBrowser() {
      const btn = document.getElementById('checkBtn');
      const loading = document.getElementById('loading');
      const resultBox = document.getElementById('resultBox');
      
      btn.disabled = true;
      loading.style.display = 'block';
      resultBox.style.display = 'none';
      
      document.getElementById('statusText').textContent = '检测中...';
      
      try {
        const report = await BrownDetective.check();
        
        // 更新 UI
        document.getElementById('statusText').textContent = '检测完成';
        
        const scoreEl = document.getElementById('riskScore');
        scoreEl.textContent = report.data.riskScore;
        scoreEl.className = 'status-value risk-' + report.data.riskLevel;
        
        const levelEl = document.getElementById('riskLevel');
        levelEl.textContent = report.data.riskLevel.toUpperCase();
        levelEl.className = 'status-value risk-' + report.data.riskLevel;
        
        const recEl = document.getElementById('recommendation');
        const recMap = {
          'allow': '✅ 放行',
          'captcha': '🔐 验证码',
          'block': '❌ 拦截'
        };
        recEl.textContent = recMap[report.data.recommendation] || report.data.recommendation;
        
        // 显示详细结果
        resultBox.style.display = 'block';
        document.getElementById('resultJson').textContent = JSON.stringify(report, null, 2);
        
      } catch (error) {
        console.error('检测失败:', error);
        document.getElementById('statusText').textContent = '检测失败';
      } finally {
        btn.disabled = false;
        loading.style.display = 'none';
      }
    }
  </script>
</body>
</html>
